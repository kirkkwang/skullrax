services:
  web:
    platform: linux/amd64 # Comment out if not using Apple Silicon otherwise build may fail
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/skullrax
    command: >
      sh -c "echo \"gem 'skullrax', path: '/skullrax'\" >> Gemfile &&
             bundle exec rails generate skullrax:install &&
             bundle exec rails assets:precompile &&
             sleep infinity"
    depends_on:
      - postgres
      - solr
      - redis
      - fcrepo
      - chrome
    environment:
      - DATABASE_URL=postgresql://hyrax_user:hyrax_password@postgres/hyrax_test
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=hyrax_user
      - DB_PASSWORD=hyrax_password
      - DB_NAME=hyrax
      - FCREPO_HOST=fcrepo
      - FCREPO_PORT=8080
      - FCREPO_REST_PATH=rest
      - RAILS_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SE_DRIVER_URL=http://chrome:4444/wd/hub
      - SOLR_HOST=solr
      - SOLR_PORT=8983
      - SOLR_URL=http://solr:8983/solr/hydra-development
      - VALKYRIE_TRANSITION=true

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hyrax_user
      POSTGRES_PASSWORD: hyrax_password
      POSTGRES_DB: hyrax

  solr:
    image: solr:8.11
    ports:
      - "8983:8983"
    volumes:
      - ./solr/conf:/opt/solr/server/configsets/hyraxconf
    command: solr-precreate hydra-development /opt/solr/server/configsets/hyraxconf

  redis:
    image: redis:alpine

  chrome:
    image: selenium/standalone-chromium:4
    shm_size: 2g
    ports:
      - "4444:4444"
      - "7900:7900"
    environment:
      - SE_NODE_SESSION_TIMEOUT=800
      - SE_ENABLE_TRACING=false

  fcrepo:
    image: ghcr.io/samvera/fcrepo4:4.7.5
    ports:
      - 8080:8080
